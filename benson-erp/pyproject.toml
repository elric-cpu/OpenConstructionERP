[project]
name = "benson-construction-erp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "google-auth>=2.35,<3",
  "google-cloud-storage>=2.18,<4",
  "opentelemetry-api>=1.44,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
  "opentelemetry-instrumentation-celery>=0.64b0,<0.66",
  "opentelemetry-instrumentation-fastapi>=0.65b0,<0.66",
  "opentelemetry-instrumentation-sqlalchemy>=0.65b0,<0.66",
  "opentelemetry-sdk>=1.44,<2",
  "prometheus-client>=0.25,<1",
  "pyjwt[crypto]>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "pyotp>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "reportlab>=4.2,<5",
  "redis>=6.4,<9",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "mypy>=1.13,<2", "pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1", "types-reportlab>=4.2,<5"]

[project.scripts]
benson-erp = "app.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "apps/api"}

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]
markers = ["postgres: requires a live PostgreSQL database"]
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]
