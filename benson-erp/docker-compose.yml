x-api-build: &api-build
  context: .
  dockerfile: infrastructure/docker/api.Dockerfile

x-api-environment: &api-environment
  DATABASE_URL: postgresql+asyncpg://benson_app:benson-app-development-only@postgres:5432/benson_erp
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: INFO
  METRICS_ENABLED: "true"
  OTEL_TRACE_SAMPLE_RATIO: "1.0"
  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: http://benson-ai:9000
  S3_BUCKET: benson-erp
  S3_REGION: us-west-2
  S3_ACCESS_KEY: minio-development
  S3_SECRET_KEY: replace-me
  S3_ADDRESSING_STYLE: path
  GOOGLE_DIRECTORY_PROVIDER: mock
  EMAIL_PROVIDER: mock
  FRONTEND_URL: http://benson-ai:5173

x-api-depends: &api-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: benson_erp
      POSTGRES_USER: benson
      POSTGRES_PASSWORD: benson-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benson -d benson_erp"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-app-role.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    ports: ["55432:5432"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio-development
      MINIO_ROOT_PASSWORD: replace-me
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 minio-development replace-me &&
        mc mb --ignore-existing local/benson-erp
  api:
    build: *api-build
    env_file:
      - path: .env
        required: false
    ports: ["8000:8000"]
    depends_on: *api-depends
    environment:
      <<: *api-environment
      OTEL_SERVICE_NAME: benson-erp-api
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  worker:
    build: *api-build
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
      ]
    env_file:
      - path: .env
        required: false
    depends_on: *api-depends
    environment:
      <<: *api-environment
      OTEL_SERVICE_NAME: benson-erp-worker
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.workers.celery_app:celery_app inspect ping --timeout=5 | grep -q pong",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  scheduler:
    build: *api-build
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    env_file:
      - path: .env
        required: false
    depends_on: *api-depends
    environment:
      <<: *api-environment
      OTEL_SERVICE_NAME: benson-erp-scheduler
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    ports: ["5173:5173"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  minio_data:
